name: build

# Builds everything a user needs, on every push and on demand:
#   * host for Windows  (electron-builder: NSIS installer + portable .exe)
#   * host for macOS    (electron-builder: .dmg + .zip, arm64 and x64; the Swift helpers are prebuilt here)
#   * iPad app          (armv7 / iOS 9 on a Linux runner: clang + ld64 from theos, iPhoneOS9.3.sdk)
# The results are workflow artifacts; a tag `v*` also publishes them as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

jobs:
  host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist -- --win
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-Display-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  host-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build: the user opens it with right click -> Open
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Swift helpers (vdisplay, mousehelper, audiosetup)
        run: bash driver/macos/build.sh
      - run: npm run dist -- --mac
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-Display-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  ipad-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xz-utils zip libtinfo5 || sudo apt-get install -y xz-utils zip
      - name: iOS toolchain (clang + ld64)
        run: |
          mkdir -p tc
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C tc
          tc/linux/iphone/bin/clang --version | head -1
      - name: iPhoneOS9.3.sdk
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks && git sparse-checkout set iPhoneOS9.3.sdk && ls iPhoneOS9.3.sdk
      - name: Build
        run: bash ios/build.sh "$PWD/tc/linux/iphone" "$PWD/sdks/iPhoneOS9.3.sdk" "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: IPadDisplay.app
          path: out/IPadDisplay.app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-windows, host-macos, ipad-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect
        run: |
          mkdir -p release
          cp artifacts/iPad-Display-windows/*.exe release/
          cp artifacts/iPad-Display-macos/*.dmg artifacts/iPad-Display-macos/*.zip release/
          cp artifacts/IPadDisplay.app/IPadDisplay.app.zip release/IPadDisplay-iPad-app.zip
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
