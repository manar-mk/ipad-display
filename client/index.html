<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>iPad Display</title>
<!-- Written in ES5 on purpose: must run in Safari on iOS 9.3.5 (iPad mini 1 / iPad 2 / iPad 3). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Display">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; -webkit-touch-callout: none; }
  #screen { position: absolute; left: 0; top: 0; }
  #msg { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: #bbb; font: 16px -apple-system, Helvetica, sans-serif; padding: 0 20px; }
  #msg b { color: #fff; display: block; font-size: 22px; margin-bottom: 8px; }
  #hud { position: absolute; left: 8px; top: 8px; color: #0f0; font: 12px Menlo, monospace; background: rgba(0,0,0,.6); padding: 4px 6px; border-radius: 4px; display: none; }
  #snd { position: absolute; right: 8px; top: 8px; color: #fff; font: 12px -apple-system, Helvetica, sans-serif; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<img id="screen" alt="">
<div id="msg"><b>iPad Display</b>Подключение к компьютеру…</div>
<div id="hud"></div>
<div id="snd">🔈 тапните, чтобы включить звук</div>
<script>
(function () {
  var img = document.getElementById('screen');
  var msg = document.getElementById('msg');
  var hud = document.getElementById('hud');
  var snd = document.getElementById('snd');
  var ws = null, retry = 1000, prevUrl = null, natW = 0, natH = 0;
  var frames = 0, bytes = 0, statT = +new Date(), hudOn = false, hudTimer = null;
  var hasObjectURL = !!(window.URL && URL.createObjectURL);
  var reader = hasObjectURL ? null : new FileReader();
  var rect = { x: 0, y: 0, w: 1, h: 1 };

  // ---------- audio (Web Audio, needs one tap on iOS) ----------
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, aRate = 22050, aCh = 1, aTime = 0, audioWanted = false;
  function enableAudio() {
    if (!AC || actx) return;
    try { actx = new AC(); } catch (e) { return; }
    // unlock on iOS: play a silent buffer inside the tap handler
    var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
    audioWanted = true; snd.style.display = 'none';
  }
  function playPCM(ab) {
    if (!actx || !audioWanted) return;
    var i16 = new Int16Array(ab), n = i16.length / aCh;
    var buf = actx.createBuffer(aCh, n, aRate);
    for (var c = 0; c < aCh; c++) { var ch = buf.getChannelData(c); for (var i = 0; i < n; i++) ch[i] = i16[i * aCh + c] / 32768; }
    var src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    var now = actx.currentTime;
    if (aTime < now + 0.05) aTime = now + 0.1;           // (re)start with 100 ms of headroom
    if (aTime > now + 1.0) aTime = now + 0.2;            // fell behind: drop backlog
    src.start(aTime); aTime += buf.duration;
  }

  // ---------- layout ----------
  function fit() {
    if (!natW || !natH) return;
    var W = window.innerWidth, H = window.innerHeight;
    var k = Math.min(W / natW, H / natH);
    var w = Math.round(natW * k), h = Math.round(natH * k);
    rect = { x: Math.round((W - w) / 2), y: Math.round((H - h) / 2), w: w, h: h };
    img.style.width = w + 'px'; img.style.height = h + 'px';
    img.style.left = rect.x + 'px'; img.style.top = rect.y + 'px';
  }

  function ack() { if (ws && ws.readyState === 1) ws.send('a'); }

  img.onload = function () {
    if (img.naturalWidth !== natW || img.naturalHeight !== natH) { natW = img.naturalWidth; natH = img.naturalHeight; fit(); }
    if (prevUrl && hasObjectURL) URL.revokeObjectURL(prevUrl);
    prevUrl = img.src;
    msg.style.display = 'none';
    if (AC && !actx) snd.style.display = 'block';
    frames++;
    if (hudOn) {
      var dt = (+new Date() - statT) / 1000;
      if (dt >= 1) { hud.textContent = natW + 'x' + natH + '  ' + (frames / dt).toFixed(1) + ' fps  ' + (bytes / dt / 1024).toFixed(0) + ' KB/s' + (actx ? '  audio' : ''); frames = 0; bytes = 0; statT = +new Date(); }
    }
    ack();
  };
  img.onerror = function () { ack(); };

  function showJPEG(blob) {
    bytes += blob.size;
    if (hasObjectURL) { img.src = URL.createObjectURL(blob); }
    else { reader.onload = function () { img.src = reader.result; }; reader.readAsDataURL(blob); }
  }

  // Typed binary message: [uint32 len][uint8 type][payload]
  function onBinary(ab) {
    var u8 = new Uint8Array(ab);
    if (u8.length < 5) return;
    var type = String.fromCharCode(u8[4]);
    if (type === 'J') { showJPEG(new Blob([u8.subarray ? u8.subarray(5) : new Uint8Array(ab, 5)], { type: 'image/jpeg' })); }
    else if (type === 'F') { var dv = new DataView(ab); aRate = dv.getUint32(5); aCh = u8[9] || 1; aTime = 0; }
    else if (type === 'A') { playPCM(ab.slice(5)); }
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    try { ws = new WebSocket(proto + location.host + '/'); } catch (e) { return schedule(); }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { retry = 1000; ws.send('hello'); msg.innerHTML = '<b>iPad Display</b>Подключено. Ожидание изображения — нажмите «Старт» на компьютере.'; };
    ws.onmessage = function (ev) { if (typeof ev.data !== 'string') onBinary(ev.data); };
    ws.onclose = function () { msg.style.display = ''; msg.innerHTML = '<b>iPad Display</b>Нет связи с компьютером. Переподключение…'; schedule(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function schedule() { setTimeout(connect, retry); retry = Math.min(retry * 1.5, 5000); }

  // ---------- touch -> host (as mouse) ----------
  function sendTouch(phase, t) {
    if (!ws || ws.readyState !== 1 || !rect.w) return;
    var x = (t.clientX - rect.x) / rect.w, y = (t.clientY - rect.y) / rect.h;
    x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
    ws.send(JSON.stringify({ t: 'touch', phase: phase, x: x, y: y }));
  }
  // One finger = mouse; two fingers = scroll (centroid movement) and pinch (distance ratio); long press = right click.
  var hudTaps = 0, hudTapT = 0, multi = false, mouseDown = false, lpTimer = null, lastC = null, lastD = 0;
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function pair(ts) { var a = ts[0], b = ts[1]; return { cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2, d: Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2)) }; }
  function clearLP() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
  document.addEventListener('touchstart', function (e) {
    e.preventDefault();
    enableAudio();
    var now = +new Date(); hudTaps = (now - hudTapT < 400) ? hudTaps + 1 : 1; hudTapT = now;
    if (hudTaps >= 3) { hudOn = !hudOn; hud.style.display = hudOn ? 'block' : 'none'; frames = 0; bytes = 0; statT = now; } // triple tap: stats
    if (e.touches.length >= 2) {
      clearLP();
      if (mouseDown) { sendTouch(2, e.touches[0]); mouseDown = false; }
      multi = true; var p = pair(e.touches); lastC = { x: p.cx, y: p.cy }; lastD = p.d; return;
    }
    if (multi) return;
    mouseDown = true; sendTouch(0, e.changedTouches[0]);
    var t0 = e.changedTouches[0];
    clearLP(); lpTimer = setTimeout(function () {
      if (!mouseDown || multi || !rect.w) return;
      sendTouch(2, t0); mouseDown = false;
      send({ t: 'rclick', x: Math.max(0, Math.min(1, (t0.clientX - rect.x) / rect.w)), y: Math.max(0, Math.min(1, (t0.clientY - rect.y) / rect.h)) });
    }, 700);
  }, false);
  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (multi && e.touches.length >= 2) {
      var p = pair(e.touches), k = natW && rect.w ? natW / rect.w : 1;
      var dx = (p.cx - lastC.x) * k, dy = (p.cy - lastC.y) * k;
      if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) { send({ t: 'scroll', dx: Math.round(dx), dy: Math.round(dy) }); lastC = { x: p.cx, y: p.cy }; }
      if (lastD > 0) { var z = (p.d / lastD - 1) * 1000; if (Math.abs(z) >= 10) { send({ t: 'zoom', d: Math.round(z) }); lastD = p.d; } }
      return;
    }
    if (multi || !mouseDown) return;
    var t = e.changedTouches[0];
    if (lpTimer && lastC === null) { /* moving cancels long press */ }
    clearLP();
    sendTouch(1, t);
  }, false);
  function touchDone(e) {
    e.preventDefault(); clearLP();
    if (mouseDown) { sendTouch(2, e.changedTouches[0]); mouseDown = false; }
    if (e.touches.length === 0) { multi = false; lastC = null; lastD = 0; }
  }
  document.addEventListener('touchend', touchDone, false);
  document.addEventListener('touchcancel', touchDone, false);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
  window.addEventListener('resize', fit, false);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); }, false);

  connect();
})();
</script>
</body>
</html>
