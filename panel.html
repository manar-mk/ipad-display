<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iPad Display</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f1f3f7; --card: #ffffff; --ink: #16181d; --dim: #5b6472; --line: #e3e6ec;
    --accent: #2f6fed; --accent-ink: #fff; --ok: #1f9d55; --warn: #d9534f; --amber: #b7791f;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11131a; --card: #191c24; --ink: #e8eaf0; --dim: #9aa3b2; --line: #262b36;
            --accent: #4d86ff; --ok: #3ecf8e; --warn: #ff6b6b; --amber: #e3b341;
            --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body { font: 13.5px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  svg.i { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
           padding: 12px 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header img.logo { width: 34px; height: 34px; border-radius: 8px; }
  header .t { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  header .s { color: var(--dim); font-size: 12px; }
  header .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
          font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--dim) 14%, transparent); color: var(--dim); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.on { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .pill.wait { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
  .pill.bad { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  select#lang { padding: 4px 6px; font-size: 12px; }

  main { padding: 16px 18px 28px; display: grid; gap: 14px; grid-template-columns: 1fr; max-width: 1100px; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } .wide { grid-column: 1 / -1; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card > h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; font-weight: 650; letter-spacing: .01em; color: var(--ink); }
  .card > h2 .n { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px;
                  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-size: 11px; font-weight: 700; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .row[hidden], .warn[hidden], button[hidden], label[hidden], .card[hidden] { display: none !important; }
  label { display: inline-flex; align-items: center; gap: 7px; }
  label.chk { padding: 5px 9px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
  label.chk:hover { border-color: var(--line); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  input[type=number], input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit;
                                                 background: color-mix(in srgb, var(--card) 50%, var(--bg)); color: var(--ink); }
  input[type=text] { width: 140px; } input[type=number] { width: 78px; }
  input[type=range] { accent-color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 9px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 22px; font-weight: 650; font-size: 14px; }
  button.primary.stop { background: var(--warn); }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 6px 12px; }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }
  button.ghost { background: transparent; border: 0; color: var(--dim); padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; }
  button.ghost:hover { color: var(--accent); }

  .sources { display: flex; gap: 10px; flex-wrap: wrap; }
  .src { border: 0; padding: 5px; border-radius: 12px; background: transparent; outline: 2px solid transparent; text-align: center; font: inherit; color: var(--dim); }
  .src img { width: 168px; height: 105px; object-fit: cover; border-radius: 8px; display: block; background: #000; border: 1px solid var(--line); }
  .src.sel { outline-color: var(--accent); color: var(--ink); }
  .src div { margin-top: 5px; font-size: 12px; }
  .src small { opacity: .65; }

  .stat { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; }
  .ok { color: var(--ok); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; }
  canvas#preview { width: 100%; max-height: 190px; background: #000; border-radius: 10px; object-fit: contain; border: 1px solid var(--line); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .url { cursor: pointer; color: var(--accent); text-decoration: none; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); }
  .conn { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .conn img { width: 132px; height: 132px; border-radius: 10px; background: #fff; padding: 6px; }
  pre.log { max-height: 130px; overflow: auto; font-size: 11px; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  .warn:not([hidden]) { display: block; color: var(--warn); font-size: 12px; margin-top: 6px; }

  ol.steps { margin: 0; padding-left: 20px; } ol.steps li { margin: 7px 0; }
  .kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; font-size: 11.5px; }
  table.faq { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12.5px; }
  table.faq td { border-top: 1px solid var(--line); padding: 7px 8px 7px 0; vertical-align: top; }
  table.faq td:first-child { color: var(--dim); width: 42%; }
</style>
<script src="i18n.js"></script>
</head>
<body>

<header>
  <img class="logo" src="assets/icon.png" alt="">
  <div>
    <div class="t">iPad Display</div>
    <div class="s" data-i18n="app.subtitle"></div>
  </div>
  <div class="grow"></div>
  <span class="pill" id="pill"><span class="dot"></span><span id="pilltext" data-i18n="pill.starting"></span></span>
  <select id="lang" data-i18n-title="app.lang">
    <option value="auto">🌐 Auto</option>
    <option value="ru">Русский</option>
    <option value="en">English</option>
  </select>
  <button class="ghost" id="helpbtn">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.9c-.5.2-.8.7-.8 1.2v.4"/><path d="M12 17h.01"/></svg>
    <span data-i18n="app.help"></span>
  </button>
</header>

<main>

<section class="card wide" id="help" hidden>
  <h2><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.9c-.5.2-.8.7-.8 1.2v.4"/><path d="M12 17h.01"/></svg> <span data-i18n="help.title"></span></h2>
  <ol class="steps">
    <li data-i18n="help.s1"></li>
    <li data-i18n="help.s2"></li>
    <li data-i18n="help.s3"></li>
    <li data-i18n="help.s4"></li>
    <li data-i18n="help.s5"></li>
    <li data-i18n="help.s6"></li>
  </ol>
  <table class="faq">
    <tr><td data-i18n="help.q1"></td><td data-i18n="help.a1"></td></tr>
    <tr><td data-i18n="help.q2"></td><td data-i18n="help.a2"></td></tr>
    <tr><td data-i18n="help.q3"></td><td data-i18n="help.a3"></td></tr>
    <tr><td data-i18n="help.q4"></td><td data-i18n="help.a4"></td></tr>
    <tr><td data-i18n="help.q5"></td><td data-i18n="help.a5"></td></tr>
  </table>
</section>

<section class="card wide">
  <h2><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v10H5z"/><path d="M9 19h6"/><path d="M12 15v4"/></svg> <span data-i18n="card.stream"></span></h2>
  <div class="row">
    <button class="primary" id="toggle" data-i18n="btn.start"></button>
    <span class="stat" id="stat" data-i18n="stat.stopped"></span>
    <span class="stat" id="vstat"></span>
  </div>
  <canvas id="preview" width="320" height="240"></canvas>
</section>

<section class="card">
  <h2><span class="n">1</span><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg> <span data-i18n="card.screen"></span></h2>
  <div class="sources" id="sources" data-i18n="screen.loading"></div>
  <div class="row" id="vddrow" hidden>
    <button class="secondary" id="vddbtn" data-i18n="screen.installVdd"></button>
    <span class="stat" id="vddstat"></span>
  </div>
  <div class="hint" id="vddhint" data-i18n="screen.hint"></div>
  <div class="warn" id="machint" hidden></div>
  <pre class="log" id="vddlog" hidden></pre>
</section>

<section class="card">
  <h2><span class="n">2</span><svg class="i" viewBox="0 0 24 24"><path d="M4 17V7a2 2 0 0 1 2-2h9"/><path d="M20 7v10a2 2 0 0 1-2 2H9"/><path d="m16 3 4 4-4 4"/><path d="M8 21l-4-4 4-4"/></svg> <span data-i18n="card.connection"></span></h2>
  <div class="row"><span class="stat" data-i18n="conn.state"></span> <span id="tcpstat" class="stat"></span></div>
  <div class="row"><span class="stat" data-i18n="conn.found"></span> <span id="found" class="stat"></span> <span class="stat" data-i18n="conn.usb"></span> <span id="usbdevs" class="stat">…</span></div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="autoconnect"> <span data-i18n="conn.auto"></span></label>
    <button class="ghost" id="manualbtn"></button>
  </div>
  <div class="warn" id="connhint" hidden></div>
  <div class="row" id="manualrow" hidden>
    <select id="tcpmode">
      <option value="usb">USB (usbmuxd)</option>
      <option value="tcp">TCP / IP</option>
    </select>
    <label id="hostlbl" hidden><span data-i18n="conn.host"></span> <input type="text" id="tcphost" value="127.0.0.1"></label>
    <label><span data-i18n="conn.port"></span> <input type="number" id="tcpport" value="7801"></label>
    <button class="secondary" id="tcpbtn" data-i18n="conn.connect"></button>
  </div>
  <div class="hint" data-i18n="conn.hint"></div>
</section>

<section class="card">
  <h2><span class="n">3</span><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 8v8"/><path d="M19 8v8"/><path d="M8.5 5.5v13"/><path d="M15.5 5.5v13"/></svg> <span data-i18n="card.quality"></span></h2>
  <div class="row">
    <label><span data-i18n="q.size"></span>
      <select id="size">
        <option value="1024x768">1024×768 (iPad mini 1 / iPad 2)</option>
        <option value="1280x960">1280×960</option>
        <option value="2048x1536">2048×1536 (Retina)</option>
        <option value="0x0" data-i18n="q.sizeNative"></option>
      </select>
    </label>
    <label><span data-i18n="q.fps"></span> <input type="number" id="fps" value="60" min="1" max="60"></label>
  </div>
  <div class="row">
    <label><span data-i18n="q.codec"></span>
      <select id="codec">
        <option value="auto" data-i18n="q.codecAuto"></option>
        <option value="ffmpeg" data-i18n="q.codecFfmpegWin"></option>
        <option value="h264" data-i18n="q.codecWebCodecs"></option>
        <option value="jpeg">JPEG</option>
      </select>
    </label>
    <label><span data-i18n="q.bitrate"></span> <input type="number" id="bitrate" value="6000" min="500" max="30000" step="500"> <span data-i18n="q.kbps"></span></label>
    <label>JPEG <input type="range" id="q" min="30" max="95" value="60"> <span id="qv" class="stat">60</span></label>
  </div>
  <div class="hint" data-i18n="q.hint"></div>
</section>

<section class="card">
  <h2><span class="n">4</span><svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg> <span data-i18n="card.audio"></span></h2>
  <div class="row">
    <label class="chk"><input type="checkbox" id="audio"> <span data-i18n="a.enable"></span></label>
    <label><span data-i18n="a.source"></span> <select id="asrc"></select></label>
    <button class="secondary" id="audiobtn" data-i18n="a.makeDevice" hidden></button>
  </div>
  <div class="row"><span class="stat" id="audiostat"></span></div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="touch"> <span data-i18n="a.touch"></span></label>
  </div>
  <div class="row">
    <label class="chk" id="mdlbl"><input type="checkbox" id="manageDisplay"> <span data-i18n="a.manageDisplay"></span></label>
    <label class="chk" id="malbl"><input type="checkbox" id="manageAudio"> <span data-i18n="a.manageAudio"></span></label>
    <label class="chk" id="adlbl"><input type="checkbox" id="audioDefault"> <span data-i18n="a.audioDefault"></span></label>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="autostart"> <span data-i18n="a.autostart"></span></label>
  </div>
  <span class="warn" id="axhint" hidden></span>
</section>

<section class="card">
  <h2><span class="n">5</span><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg> <span data-i18n="card.safari"></span></h2>
  <div class="conn">
    <img id="qr" alt="QR">
    <div>
      <div id="urls">…</div>
      <div class="row"><span class="stat" data-i18n="safari.browsers"></span> <span id="wsclients" class="stat">0</span></div>
      <div class="hint" data-i18n="safari.hint"></div>
    </div>
  </div>
</section>

</main>

<script>
const $ = (s) => document.querySelector(s);
const t = (k, v) => i18n.t(k, v);
let settings = {}, sources = [], selected = null, running = false, stream = null, timer = null;
const video = document.createElement('video'); video.muted = true; video.playsInline = true;
const work = document.createElement('canvas'), wctx = work.getContext('2d', { alpha: false });
const small = document.createElement('canvas'); small.width = 48; small.height = 36; const sctx = small.getContext('2d', { alpha: false, willReadFrequently: true });
const preview = $('#preview'), pctx = preview.getContext('2d', { alpha: false });
let prevSmall = null, lastForced = 0, frames = 0, bytes = 0, statT = Date.now(), encoding = false;
let rendererPeak = 0;
let audioCtx = null, audioNode = null, audioTrack = null, audioLabel = '', aChunks = 0;

// ---------- settings <-> UI ----------
function applySettingsToUI() {
  $('#size').value = settings.size; $('#fps').value = settings.fps; $('#q').value = settings.quality; $('#qv').textContent = settings.quality;
  $('#codec').value = settings.codec || 'auto'; $('#bitrate').value = settings.bitrate || 6000;
  for (const k of ['autostart', 'audio', 'touch', 'autoconnect', 'manageDisplay', 'manageAudio', 'audioDefault']) $('#' + k).checked = !!settings[k];
  $('#lang').value = settings.lang || 'auto';
  const win = settings.platform === 'win32', mac = settings.platform === 'darwin';
  // the virtual monitor is session-scoped only on Windows; on macOS it lives as long as the vdisplay helper does
  $('#mdlbl').hidden = !win;
  $('#malbl').hidden = !win && !mac; $('#adlbl').hidden = !win && !mac;
}
function readSettingsFromUI() {
  return { size: $('#size').value, fps: Number($('#fps').value) || 15, quality: Number($('#q').value) || 60,
    codec: $('#codec').value, bitrate: Number($('#bitrate').value) || 6000,
    autostart: $('#autostart').checked, audio: $('#audio').checked, audioSource: $('#asrc').value, touch: $("#touch").checked, manageDisplay: $("#manageDisplay").checked, manageAudio: $("#manageAudio").checked, audioDefault: $("#audioDefault").checked, autoconnect: $('#autoconnect').checked, lang: $('#lang').value || 'auto' };
}
async function persist() { settings = await host.saveSettings(readSettingsFromUI()); }

async function loadSources() {
  sources = await host.getSources();
  const box = $('#sources'); box.innerHTML = '';
  let hasVirtual = false;
  sources.forEach((s) => {
    const b = document.createElement('button'); b.className = 'src' + (s.selected ? ' sel' : '');
    const dim = s.bounds ? s.bounds.width + '×' + s.bounds.height : '';
    if (s.bounds && Math.abs(s.bounds.width / s.bounds.height - 4 / 3) < 0.02) hasVirtual = true;
    b.innerHTML = '<img src="' + s.thumb + '"><div>' + s.name + ' <small>' + dim + '</small></div>';
    b.onclick = () => { selected = s.id; host.selectSource(s.id); [...box.children].forEach(c => c.classList.remove('sel')); b.classList.add('sel'); if (running) restart(); };
    if (s.selected) selected = s.id;
    box.appendChild(b);
  });
  $('#vddrow').hidden = hasVirtual;
  if (settings.platform === 'darwin') {
    $('#vddbtn').textContent = t('screen.createVdd');
    $('#vddhint').textContent = t('screen.hintMac');
  }
}

async function loadInfo() {
  const info = await host.getInfo();
  settings = { ...info.settings, platform: info.platform };
  if (info.platform === 'darwin') {
    const o = $('#codec').querySelector('option[value=ffmpeg]'); if (o) o.textContent = t('q.codecFfmpegMac');
    $('#audiobtn').hidden = false; $('#audiobtn').title = t('a.makeDeviceHint');
  }
  $('#qr').src = info.qr || '';
  $('#urls').innerHTML = info.urls.length
    ? info.urls.map(u => '<div><code class="url" title="' + t('safari.openHint') + '">' + u + '</code></div>').join('')
    : '<span class="warn">' + t('safari.noNetwork') + '</span>';
  document.querySelectorAll('.url').forEach(el => el.onclick = () => host.openExternal(el.textContent));
  return info;
}

function targetSize(vw, vh) {
  const [mw, mh] = $('#size').value.split('x').map(Number);
  if (!mw || !mh) return [vw, vh];
  const k = Math.min(mw / vw, mh / vh, 1);
  return [Math.round(vw * k), Math.round(vh * k)];
}

// ---------- audio source list (virtual cable = separate "iPad" output device in Windows) ----------
const isCable = (label) => /CABLE Output|VB-Audio|Virtual Cable|BlackHole|iPad/i.test(label || ''); // VB-CABLE (Windows), BlackHole (macOS)
async function loadAudioDevices() {
  const sel = $('#asrc'), cur = settings.audioSource || 'auto';
  let devs = [];
  try { devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId && d.deviceId !== 'default' && d.deviceId !== 'communications'); } catch (e) { /* no devices */ }
  sel.innerHTML = '<option value="auto">' + t('a.auto') + '</option><option value="loopback">' + t('a.loopback') + '</option>'
    + devs.map(d => '<option value="' + d.deviceId + '">' + (d.label || t('a.device')) + (isCable(d.label) ? ' ★' : '') + '</option>').join('');
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : 'auto';
  host.log('audio inputs: ' + devs.map(d => d.label).join(' | '));
  return devs;
}
async function resolveAudioSource() {
  const v = $('#asrc').value;
  if (v !== 'auto') return v;
  const devs = await loadAudioDevices();
  const cable = devs.find(d => isCable(d.label));
  return cable ? cable.deviceId : 'loopback';
}

// ---------- audio: chosen source -> 22050 Hz mono s16le chunks ----------
async function startAudio(s) {
  host.log('startAudio: checkbox=' + $('#audio').checked + ' displayAudioTracks=' + s.getAudioTracks().length);
  if (!$('#audio').checked) return;
  let track = null;
  const srcId = await resolveAudioSource();
  host.log('audio source=' + srcId + ' displayTracks=' + s.getAudioTracks().length);
  if (srcId !== 'loopback') {
    try {
      const ms = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: srcId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      track = ms.getAudioTracks()[0]; audioLabel = t('audio.cable');
    } catch (e) { host.log('audio device failed: ' + e.message); }
  }
  if (!track) { track = s.getAudioTracks()[0]; audioLabel = t('audio.system'); }
  if (!track) { host.log('audio: no track'); return; }
  audioTrack = track; host.log('audio: using ' + audioLabel + ' ' + track.label);
  const RATE = 22050;
  audioCtx = new AudioContext({ sampleRate: RATE });
  const src = audioCtx.createMediaStreamSource(new MediaStream([track]));
  audioNode = audioCtx.createScriptProcessor(2048, 1, 1);
  host.sendAudioFormat(RATE, 1);
  audioNode.onaudioprocess = (ev) => {
    aChunks++;
    if (!running || !$('#audio').checked) return;
    const f = ev.inputBuffer.getChannelData(0);
    const out = new Int16Array(f.length);
    let p = 0;
    for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); if (v > p) p = v; else if (-v > p) p = -v; out[i] = v < 0 ? v * 32768 : v * 32767; }
    if (p * 32767 > rendererPeak) rendererPeak = Math.round(p * 32767); // reference level: this capture reads the same cable as ffmpeg does
    host.sendAudio(out.buffer);
  };
  src.connect(audioNode); audioNode.connect(audioCtx.destination); // destination keeps the node alive; it is muted upstream
}
function stopAudio() { if (audioNode) { audioNode.disconnect(); audioNode = null; } if (audioCtx) { audioCtx.close(); audioCtx = null; } if (audioTrack) { audioTrack.stop(); audioTrack = null; } audioLabel = ''; }

// ---------- H.264 for the native app (WebCodecs VideoEncoder, hardware when available) ----------
let enc = null, encTimer = null, forceKey = true, encW = 0, encH = 0, h264Ok = null, vFrames = 0, vBytes = 0, vT = Date.now();
const vwork = document.createElement('canvas'), vctx = vwork.getContext('2d', { alpha: false });
let appConnected = false, wsCount = 0;
const H264_CODEC = 'avc1.42E028'; // constrained baseline, level 4.0: enough for 1024x768 @ 60
async function h264Available() {
  if (h264Ok !== null) return h264Ok;
  try {
    if (typeof VideoEncoder === 'undefined') { h264Ok = false; return false; }
    const r = await VideoEncoder.isConfigSupported({ codec: H264_CODEC, width: 1024, height: 768, framerate: 60, bitrate: 6000000, avc: { format: 'avc' }, latencyMode: 'realtime' });
    h264Ok = !!r.supported;
  } catch (e) { h264Ok = false; }
  host.log('h264 encoder available: ' + h264Ok);
  return h264Ok;
}
function useH264() { const c = $('#codec').value; return c === 'h264' || (c === 'auto' && h264Ok === true); }

// Fallback chain: not every platform encoder accepts every profile / acceleration mode.
const ENC_CONFIGS = [
  { codec: 'avc1.42E028', hardwareAcceleration: 'prefer-hardware' },
  { codec: 'avc1.4D0028', hardwareAcceleration: 'prefer-hardware' },
  { codec: 'avc1.640028', hardwareAcceleration: 'prefer-hardware' },
  { codec: 'avc1.42E028', hardwareAcceleration: 'no-preference' },
  { codec: 'avc1.4D0028', hardwareAcceleration: 'no-preference' },
  { codec: 'avc1.42E028', hardwareAcceleration: 'prefer-software' },
  { codec: 'avc1.42E01F', hardwareAcceleration: 'no-preference', framerateCap: 30 },
];
let encCfgIdx = 0, encRetryAt = 0, encCfgName = '';
function startEncoder(w, h) {
  stopEncoder();
  if (encCfgIdx >= ENC_CONFIGS.length) { encCfgIdx = 0; }
  const cfg = ENC_CONFIGS[encCfgIdx];
  encRetryAt = Date.now() + 1500;
  enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) {
        const d = meta.decoderConfig.description;
        host.sendVideoConfig(d instanceof ArrayBuffer ? d : d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength));
      }
      const buf = new ArrayBuffer(chunk.byteLength); chunk.copyTo(buf);
      host.sendVideoChunk(buf, chunk.type === 'key', Math.round(chunk.timestamp / 1000));
      vFrames++; vBytes += chunk.byteLength;
    },
    error: (e) => { host.log('encoder error (' + cfg.codec + '/' + cfg.hardwareAcceleration + '): ' + e.message); stopEncoder(); encCfgIdx++; },
  });
  const fr = Math.min(Number($('#fps').value) || 60, cfg.framerateCap || 60);
  try {
    enc.configure({ codec: cfg.codec, width: w, height: h, framerate: fr, bitrate: (Number($('#bitrate').value) || 6000) * 1000,
      hardwareAcceleration: cfg.hardwareAcceleration, avc: { format: 'avc' }, latencyMode: 'realtime' });
  } catch (e) { host.log('configure threw (' + cfg.codec + '): ' + e.message); stopEncoder(); encCfgIdx++; return; }
  encW = w; encH = h; forceKey = true; encCfgName = cfg.codec + ' ' + cfg.hardwareAcceleration;
  host.log('encoder configured ' + w + 'x' + h + ' ' + encCfgName);
}
function stopEncoder() { if (enc) { try { enc.close(); } catch (e) {} enc = null; } encW = encH = 0; }

// One loop at the target fps: draws the capture into the work canvas and feeds the encoder.
let extEnc = false, extLatency = null; // main process runs ffmpeg (hardware) for the app: no WebCodecs, no JPEG for it
function videoTick() {
  if (!running || !appConnected || extEnc || !useH264() || video.videoWidth === 0) return;
  const [w, h] = targetSize(video.videoWidth, video.videoHeight);
  const ew = w & ~1, eh = h & ~1; // even dimensions for H.264
  if (!enc || encW !== ew || encH !== eh) {
    if (Date.now() < encRetryAt) return; // don't hammer a failing encoder
    vwork.width = ew; vwork.height = eh; startEncoder(ew, eh);
    if (!enc) return;
  }
  if (enc.state !== 'configured') return;
  if (enc.encodeQueueSize > 2) return; // encoder is behind: skip this frame rather than queue latency
  vctx.drawImage(video, 0, 0, ew, eh);
  const frame = new VideoFrame(vwork, { timestamp: Math.round(performance.now() * 1000) });
  try { enc.encode(frame, { keyFrame: forceKey }); forceKey = false; } catch (e) { host.log('encode: ' + e.message); }
  frame.close();
}
host.onNeedKey(() => { forceKey = true; });
setInterval(async () => {
  if (!running) { $('#vstat').textContent = ''; return; }
  const s = await host.videoStats();
  const dt = (Date.now() - vT) / 1000; vT = Date.now();
  extEnc = !!s.external; extLatency = s.latency;
  if (extEnc && enc) stopEncoder();
  const lat = s.latency !== null && s.latency !== undefined ? t('v.latency', { ms: s.latency }) : '';
  const drop = s.dropped ? t('v.dropped', { n: s.dropped }) : '';
  const line = extEnc ? (t('v.hw', { enc: 'ffmpeg/' + (settings.platform === 'darwin' ? 'VideoToolbox' : 'MF'), fps: s.fps.toFixed(0), mbps: (s.kbps / 1000).toFixed(1) }) + drop + lat)
    : enc ? (t('v.sw', { w: encW, h: encH, fps: (vFrames / dt).toFixed(0), mbps: (vBytes * 8 / dt / 1e6).toFixed(1) }) + drop + ' · ' + encCfgName + lat)
    : (s.encoder === 'ffmpeg' ? t('v.waitHw') : useH264() ? t('v.wait') : t('v.jpeg'));
  $('#vstat').textContent = line;
  // with the external encoder no JPEG frames flow, so #stat would keep the 'preparing' text
  if (running && extEnc) $('#stat').textContent = t('stat.capture', { w: video.videoWidth || '?', h: video.videoHeight || '?' }) + (audioNode ? t('stat.sound', { src: audioLabel }) : '');
  if ((enc || extEnc) && (Date.now() / 1000 | 0) % 5 === 0) host.log('video: ' + line);
  if ((Date.now() / 1000 | 0) % 5 === 0) host.log('audio: chunks=' + aChunks + ' ctx=' + (audioCtx ? audioCtx.state : '-') + ' track=' + (audioTrack ? audioTrack.readyState + (audioTrack.muted ? '/muted' : '') : '-') + ' label=' + audioLabel + ' toApp sent=' + s.audioSent + ' dropped=' + s.audioDropped + ' peak=' + s.audioPeak + '/' + s.refPeak + ' via ' + s.audioSource);
  host.audioLevel(rendererPeak); rendererPeak = 0; // lets the main process see when its own ffmpeg capture went silent while this one did not
  vFrames = 0; vBytes = 0;
}, 1000);

// ---------- capture ----------
async function start() {
  // bring up the virtual monitor and move the sound to the cable before we pick a capture source
  $('#stat').textContent = t('stat.preparing');
  await host.sessionStart();
  await loadSources();
  try {
    if (selected) await host.selectSource(selected);
    const wantLoopback = $('#audio').checked && (await resolveAudioSource()) === 'loopback';
    await host.setLoopback(wantLoopback);
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 60 } }, audio: wantLoopback });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 60 } }, audio: false }); }
    catch (e2) { $('#stat').textContent = t('stat.captureError', { e: e2.message }); return; }
  }
  video.srcObject = new MediaStream(stream.getVideoTracks()); await video.play();
  await h264Available();
  running = true; prevSmall = null; frames = 0; bytes = 0; statT = Date.now();
  $('#toggle').textContent = t('btn.stop'); $('#toggle').classList.add('stop'); refreshPill();
  startAudio(stream);
  schedule();
}

function schedule() {
  clearInterval(timer); clearInterval(encTimer);
  const period = Math.max(16, 1000 / Number($('#fps').value || 15));
  timer = setInterval(tick, period);          // JPEG (Safari clients, or the app when H.264 is off)
  encTimer = setInterval(videoTick, period);  // H.264 (native app)
}

function stop(keepSession) {
  running = false; clearInterval(timer); clearInterval(encTimer); stopAudio(); stopEncoder();
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  $('#toggle').textContent = t('btn.start'); $('#toggle').classList.remove('stop'); $('#stat').textContent = t('stat.stopped'); refreshPill();
  host.log('panel stop(keep=' + !!keepSession + ') from ' + ((new Error()).stack || '').split('\n').slice(1, 3).join(' <- ').replace(/\s+/g, ' '));
  if (!keepSession) host.sessionStop(); // put the virtual monitor and the sound device back
}
async function restart() { stop(true); await start(); }

function tick() {
  if (!running || encoding || video.videoWidth === 0) return;
  if (appConnected && (useH264() || extEnc) && wsCount === 0) return; // the app gets H.264; nobody needs JPEG right now
  const [w, h] = targetSize(video.videoWidth, video.videoHeight);
  if (work.width !== w || work.height !== h) { work.width = w; work.height = h; prevSmall = null; }
  wctx.drawImage(video, 0, 0, w, h);

  // Change detection on a tiny downscaled copy: skip identical frames, but force one every 2 s (keep-alive / late joiners).
  sctx.drawImage(work, 0, 0, small.width, small.height);
  const d = sctx.getImageData(0, 0, small.width, small.height).data;
  const now = Date.now();
  let changed = !prevSmall || now - lastForced > 2000;
  if (!changed) { for (let i = 0; i < d.length; i += 4) { if (Math.abs(d[i] - prevSmall[i]) > 8 || Math.abs(d[i+1] - prevSmall[i+1]) > 8 || Math.abs(d[i+2] - prevSmall[i+2]) > 8) { changed = true; break; } } }
  if (!changed) return;
  prevSmall = d; if (now - lastForced > 2000) lastForced = now;

  encoding = true;
  work.toBlob(async (blob) => {
    encoding = false;
    if (!blob || !running) return;
    const ab = await blob.arrayBuffer();
    host.sendFrame(ab);
    frames++; bytes += ab.byteLength;
    pctx.drawImage(work, 0, 0, preview.width, preview.height);
    const dt = (Date.now() - statT) / 1000;
    if (dt >= 1) { $('#stat').textContent = t('stat.live', { w, h, fps: (frames / dt).toFixed(1), mbps: (bytes / dt / 1024 / 128).toFixed(2) }) + (audioNode ? t('stat.sound', { src: audioLabel }) : ''); frames = 0; bytes = 0; statT = Date.now(); }
  }, 'image/jpeg', Number($('#q').value) / 100);
}

// ---------- header: help, manual connect, status pill ----------
let lastStatus = null;
$('#helpbtn').onclick = () => { const h = $('#help'); h.hidden = !h.hidden; if (!h.hidden) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
$('#manualbtn').onclick = () => { const r = $('#manualrow'); r.hidden = !r.hidden; $('#manualbtn').textContent = t('conn.manual') + (r.hidden ? ' ▾' : ' ▴'); };
function refreshPill() {
  const s = lastStatus, p = $('#pill');
  const found = !!(s && s.discovered.length), conn = !!(s && s.tcp.state === 'connected');
  let cls = '', txt = t('pill.notFound');
  if (conn && running) { cls = 'on'; txt = t(s.tcp.mode === 'usb' ? 'pill.connectedUsb' : 'pill.connectedWifi'); }
  else if (conn) { cls = 'wait'; txt = t('pill.connectedIdle'); }
  else if (s && s.tcp.state === 'declined') { cls = 'bad'; txt = t('pill.declined'); }
  else if (found) { cls = 'wait'; txt = t(running ? 'pill.foundConnecting' : 'pill.foundIdle'); }
  else if (running) { cls = 'wait'; txt = t('pill.runningNotFound'); }
  p.className = 'pill ' + cls; $('#pilltext').textContent = txt;
  // the two usual reasons for "nothing happens": auto-connect is off, or the iPad is locked
  const off = found && !$('#autoconnect').checked && !conn;
  const locked = !conn && s && s.tcp.hint === 'locked';
  $('#connhint').hidden = !(off || locked);
  if (off) $('#connhint').textContent = t('conn.autoOff');
  else if (locked) $('#connhint').textContent = t('conn.locked');
}

// ---------- UI events ----------
$('#toggle').onclick = () => running ? stop() : start();
$('#fps').onchange = () => { persist(); if (running) schedule(); };
$('#q').oninput = () => { $('#qv').textContent = $('#q').value; };
$('#q').onchange = persist;
$('#size').onchange = () => { prevSmall = null; persist(); };
for (const k of ['autostart', 'touch', 'manageDisplay', 'manageAudio', 'audioDefault']) $('#' + k).onchange = persist;
$('#autoconnect').onchange = () => { persist(); refreshPill(); };
$('#audio').onchange = async () => { await persist(); if (running) restart(); };
$('#codec').onchange = async () => { await persist(); stopEncoder(); };
$('#bitrate').onchange = async () => { await persist(); stopEncoder(); };
$('#asrc').onchange = async () => { await persist(); if (running) restart(); };
$('#tcpmode').onchange = () => { $('#hostlbl').hidden = $('#tcpmode').value === 'usb'; };
$('#tcpbtn').onclick = async () => {
  if ($('#tcpbtn').dataset.on) { await host.tcpDisconnect(); delete $('#tcpbtn').dataset.on; $('#tcpbtn').textContent = t('conn.connect'); return; }
  if ($('#tcpmode').value === 'usb') await host.usbConnect(Number($('#tcpport').value));
  else await host.tcpConnect($('#tcphost').value.trim(), Number($('#tcpport').value));
  $('#tcpbtn').dataset.on = '1'; $('#tcpbtn').textContent = t('conn.disconnect');
};
$('#audiobtn').onclick = async () => {
  $('#audiostat').textContent = '…';
  const r = await host.setupAudio();
  $('#audiostat').textContent = r.error || r.out || ('код ' + r.code);
  if (!r.error && r.code === 0) setTimeout(loadAudioDevices, 2000);
};
$('#vddbtn').onclick = async () => {
  $('#vddstat').textContent = t(settings.platform === 'darwin' ? 'screen.creating' : 'screen.installing');
  const r = await host.installVdd();
  $('#vddstat').textContent = r.error ? r.error : (r.code === 0 ? t('screen.done') : t('screen.failed', { code: r.code }));
  if (r.out) { $('#vddlog').hidden = false; $('#vddlog').textContent = r.out; }
  setTimeout(loadSources, 3000);
};
async function refreshUsb() {
  const r = await host.usbList();
  const el = $('#usbdevs');
  if (r.error) { el.textContent = t('conn.noUsbmuxd'); el.className = 'stat'; el.title = r.error; return; }
  el.className = 'stat ' + (r.devices.length ? 'ok' : '');
  el.textContent = r.devices.length ? r.devices.map(d => d.serial.slice(0, 8) + '…').join(', ') : t('conn.noDevices');
}
function renderStatus(s) {
  appConnected = s.tcp.state === 'connected'; wsCount = s.ws.length; lastStatus = s; refreshPill();
  if (!appConnected) stopEncoder();
  $('#wsclients').textContent = s.ws.length + (s.ws.length ? ' (' + s.ws.map(ip => ip.replace('::ffff:', '')).join(', ') + ')' : '');
  const map = { off: t('state.off'), connecting: t('state.connecting'), connected: t('state.connected'), retrying: t('state.retrying'), declined: t('state.declined') };
  const el = $('#tcpstat');
  const via = s.tcp.state === 'connected' ? (s.tcp.mode === 'usb' ? t('state.viaUsb') : t('state.viaWifi', { host: s.tcp.host })) : '';
  el.textContent = (map[s.tcp.state] || s.tcp.state) + via + (s.tcp.error ? ' — ' + s.tcp.error : '');
  el.className = 'stat ' + (s.tcp.state === 'connected' ? 'ok' : s.tcp.state === 'retrying' ? 'warn' : '');
  $('#found').textContent = s.discovered.length ? s.discovered.map(d => (d.busy ? t('conn.busy', { ip: d.ip }) : d.ip)).join(', ') : t('conn.nobody');
  if (s.mac) { // macOS permissions and helpers
    const hints = [];
    if (s.mac.screenAccess && s.mac.screenAccess !== 'granted') hints.push(t('mac.screen'));
    if (s.mac.vdisplayError) hints.push(t('mac.vdisplay', { e: s.mac.vdisplayError }));
    $('#machint').hidden = !hints.length; $('#machint').textContent = hints.join(' ');
    const ax = s.mac.mouseError ? s.mac.mouseError : s.mac.axTrusted === false ? t('mac.ax') : '';
    $('#axhint').hidden = !ax; $('#axhint').textContent = ax;
  }
}
host.onStatus(renderStatus);
host.onSessionHint((key) => { const el = $('#audiostat'); el.textContent = key ? t('a.' + key) : ''; el.className = key ? 'warn' : 'stat'; });
host.onServerError((m) => { $('#urls').innerHTML = '<span class="warn">' + t('err.server', { m }) + '</span>'; });

function applyLang() {
  i18n.setLang($('#lang').value || 'auto');
  document.documentElement.lang = i18n.lang;
  i18n.applyI18n();
  $('#toggle').textContent = t(running ? 'btn.stop' : 'btn.start');
  $('#manualbtn').textContent = t('conn.manual') + ($('#manualrow').hidden ? ' ▾' : ' ▴');
  $('#tcpbtn').textContent = t($('#tcpbtn').dataset.on ? 'conn.disconnect' : 'conn.connect');
  if (!running) $('#stat').textContent = t('stat.stopped');
  loadAudioDevices(); loadSources();
  if (lastStatus) renderStatus(lastStatus); else refreshPill();
  refreshUsb();
}
$('#lang').onchange = async () => { await persist(); applyLang(); };

(async () => {
  const info = await loadInfo();
  applySettingsToUI();
  applyLang();
  await loadAudioDevices();
  await loadSources();
  refreshUsb();
  if (info.autostart) start();
})();
setInterval(loadInfo, 15000); setInterval(refreshUsb, 5000); setInterval(() => { if (!running) loadSources(); }, 10000);
</script>
</body>
